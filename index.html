<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StormGuard – Monitor</title>
  <style>
    :root {
      --bg: #0f0f17;
      --card-bg: rgba(30, 30, 50, 0.6);
      --text: #e0e0ff;
      --accent: #7c5eff;
      --spacing-sm: 12px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1a1a2e);
      color: var(--text);
      min-height: 100vh;
      padding: var(--spacing-sm) var(--spacing-sm) 100px;
      font-size: clamp(15px, 3.8vw, 16px);
    }

    h1 { font-size: clamp(1.8rem, 8vw, 2.2rem); text-align: center; margin: 0 0 20px; }
    button {
      background: linear-gradient(135deg, var(--accent), #5a3aff);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(124,94,255,0.3);
      transition: all 0.2s;
      min-width: 180px;
      margin: 12px auto;
      display: block;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,94,255,0.4); }

    #status, #current-brightness {
      text-align: center;
      font-size: 1.1rem;
      margin: 12px 0;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px;
      margin: 16px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    #latest-alert {
      background: rgba(30, 30, 50, 0.8);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 16px 0;
      font-size: 0.95rem;
      border-left: 5px solid #ef4444;
      display: none;
    }

    #ad-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: linear-gradient(180deg, rgba(20,20,40,0.9), rgba(10,10,30,0.95));
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(124,94,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: #aaa;
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }

    #settings-link {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), #5a3aff);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 16px rgba(124,94,255,0.4);
      z-index: 1100;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>StormGuard</h1>

  <div class="card">
    <button id="toggleBtn">Start Monitoring</button>
  </div>

  <div id="status">Ready — point camera at the sky</div>
  <div id="current-brightness">Current Brightness: —</div>

  <div id="latest-alert"></div>

  <div class="card">
    <a href="log.html" style="text-decoration:none; color:inherit;">
      <button>View Full Log</button>
    </a>
    <a href="graph.html" style="text-decoration:none; color:inherit;">
      <button>View Detailed Graph</button>
    </a>
  </div>

  <p id="tips" style="text-align:center; font-size:0.9rem; color:#a0a0c0; margin-top:20px;">
    Real-time lightning detection • Settings saved automatically
  </p>

  <a id="settings-link" href="settings.html">⚙</a>

  <div id="ad-banner">
    <div class="placeholder-text">Sponsored Space – Your ad here</div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

  <script>
    // Global shared state
    let stream = null;
    let audioCtx = null;
    let analyser = null;
    let prevBrightness = 0;
    let lastFlashTime = null;
    let isMonitoring = false;
    let recentFlashes = [];
    let analysisInterval = null;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const status = document.getElementById('status');
    const brightnessDisplay = document.getElementById('current-brightness');
    const toggleBtn = document.getElementById('toggleBtn');
    const latestAlert = document.getElementById('latest-alert');

    // Load settings
    let brightnessThreshold = localStorage.getItem('flashSensitivity') || 30;
    let audioThreshold = localStorage.getItem('thunderThreshold') || 55;
    let logThreshold = localStorage.getItem('logCertainty') || 30;
    let useBackCamera = localStorage.getItem('useBackCamera') !== 'false';

    // Show latest alert on main screen
    function updateLatestAlert() {
      const logs = JSON.parse(localStorage.getItem('logEntries') || '[]');
      if (logs.length === 0) {
        latestAlert.style.display = 'none';
        return;
      }
      latestAlert.innerHTML = logs[0]; // newest first
      latestAlert.style.display = 'block';
    }

    // Initial load
    updateLatestAlert();

    toggleBtn.onclick = async () => {
      if (!isMonitoring) {
        status.textContent = "Requesting camera & microphone...";
        toggleBtn.disabled = true;

        try {
          const facingMode = useBackCamera ? "environment" : "user";
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode },
            audio: true
          });
          video.srcObject = stream;

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          status.textContent = `Monitoring active (${useBackCamera ? 'back' : 'front'} camera)`;
          brightnessDisplay.textContent = 'Current Brightness: Calculating...';

          toggleBtn.textContent = "Stop Monitoring";
          isMonitoring = true;

          analysisInterval = setInterval(monitorFrame, 150);
          setInterval(sampleAndUpdate, 1000);
        } catch (err) {
          status.textContent = `Error: ${err.message}`;
          toggleBtn.disabled = false;
        }
      } else {
        if (stream) stream.getTracks().forEach(track => track.stop());
        if (audioCtx) audioCtx.close();
        if (analysisInterval) clearInterval(analysisInterval);
        recentFlashes = [];
        lastFlashTime = null;
        status.textContent = "Monitoring stopped";
        brightnessDisplay.textContent = 'Current Brightness: —';
        toggleBtn.textContent = "Start Monitoring";
        isMonitoring = false;
      }
    };

    function monitorFrame() {
      if (!stream) return;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let sum = 0;
      for (let i = 0; i < data.length; i += 4) sum += (data[i] + data[i+1] + data[i+2]) / 3;
      let brightness = Math.round(sum / (data.length / 4));

      brightnessDisplay.textContent = `Current Brightness: ${brightness}`;

      if (brightness - prevBrightness > brightnessThreshold && prevBrightness > 20) {
        recentFlashes.push(Date.now());
        lastFlashTime = Date.now();
        const cert = Math.min(60, 20 + (brightness - prevBrightness) / 2);
        addLogEntry(`Flash detected | Brightness ${brightness}`, cert);
      }
      prevBrightness = brightness;
      recentFlashes = recentFlashes.filter(t => Date.now() - t < 15000);
    }

    function sampleAndUpdate() {
      if (!analyser) return;
      const now = Date.now();
      const buffer = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(buffer);
      let maxAudio = 0;
      for (let v of buffer) maxAudio = Math.max(maxAudio, Math.abs(v - 128));

      const hasRecentFlash = recentFlashes.some(t => now - t <= 15000);
      const thunderNow = maxAudio > audioThreshold;
      const isHit = hasRecentFlash && thunderNow;

      if (isHit) {
        const delay = (now - lastFlashTime) / 1000;
        const distance = Math.round(delay / 3);
        const certainty = Math.min(100, 80 + maxAudio / 6);
        addLogEntry(`Lightning strike detected • Sound (${maxAudio}) • Distance ~ ${distance} km`, certainty);
        status.textContent = `Strike ≈ ${distance} km away`;
      } else if (hasRecentFlash) {
        addLogEntry(`Flash waiting for thunder sound`, 45);
      } else if (thunderNow) {
        addLogEntry(`Thunder sound detected (no recent flash)`, Math.min(70, 40 + maxAudio / 5));
      }
    }

    function addLogEntry(msg, certainty) {
      const time = new Date().toLocaleTimeString('en-ZA', { hour12: false });
      const certaintyClass = certainty >= 80 ? 'high' : certainty >= 50 ? 'medium' : 'low';

      const entry = `
        <div style="margin-bottom:12px; padding:10px; border-right:5px solid ${certainty >= 80 ? '#ef4444' : certainty >= 50 ? '#f59e0b' : '#22c55e'}; background:rgba(0,0,0,0.2); border-radius:6px;">
          <span style="color:#a0a0c0; font-weight:bold;">[${time}]</span> ${msg}
          <span style="float:right; font-weight:bold; color:white; background:${certainty >= 80 ? '#ef4444' : certainty >= 50 ? '#f59e0b' : '#22c55e'}; padding:2px 8px; border-radius:10px;">${Math.round(certainty)}%</span>
        </div>
      `;

      let logs = JSON.parse(localStorage.getItem('logEntries') || '[]');
      logs.unshift(entry);
      if (logs.length > 200) logs.pop();
      localStorage.setItem('logEntries', JSON.stringify(logs));

      updateLatestAlert();
    }

    function updateLatestAlert() {
      const logs = JSON.parse(localStorage.getItem('logEntries') || '[]');
      if (logs.length === 0) {
        latestAlert.style.display = 'none';
        return;
      }
      latestAlert.innerHTML = logs[0];
      latestAlert.style.display = 'block';
    }
  </script>
</body>
</html>
