<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>StormGuard – Lightning Monitor</title>
  <style>
    :root {
      --bg: #0f0f17;
      --card-bg: rgba(30, 30, 50, 0.6);
      --text: #e0e0ff;
      --accent: #7c5eff;
      --accent-glow: rgba(124, 94, 255, 0.25);
      --spacing-sm: 12px;
      --spacing-md: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1a1a2e);
      color: var(--text);
      min-height: 100vh;
      padding: var(--spacing-sm) var(--spacing-sm) 120px; /* reduced bottom for mobile */
      font-size: clamp(14px, 3.5vw, 16px); /* fluid base font */
      line-height: 1.5;
    }

    h1 {
      font-size: clamp(1.6rem, 7vw, 1.9rem);
      margin: 0 0 16px;
      background: linear-gradient(90deg, #a78bfa, #7c5eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    button {
      background: linear-gradient(135deg, var(--accent), #5a3aff);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px; /* better touch target */
      font-size: clamp(0.9rem, 4vw, 1rem);
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 15px var(--accent-glow);
      transition: all 0.2s ease;
      min-width: 160px;
      min-height: 48px; /* iOS/Android touch minimum */
      display: block;
      margin: 10px auto;
    }

    #status, #current-brightness {
      font-size: clamp(1rem, 4vw, 1.1rem);
      text-align: center;
      margin: 10px 0;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px;
      margin: 12px 0;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }

    #tips {
      font-size: clamp(0.75rem, 3vw, 0.82rem);
      color: #a0a0c0;
      text-align: center;
      margin: 16px 0 80px;
      line-height: 1.4;
    }

    #ad-banner {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      height: 70px; /* smaller on mobile */
      background: linear-gradient(180deg, rgba(20,20,40,0.9), rgba(10,10,30,0.95));
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(124,94,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.85rem, 3.5vw, 0.95rem);
      color: #aaa;
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      transition: height 0.3s ease, opacity 0.3s ease;
    }

    /* Settings FAB – smaller & thumb-friendly on mobile */
    #settings-fab {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #5a3aff);
      color: white;
      font-size: 1.4rem;
      box-shadow: 0 4px 16px rgba(124,94,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1100;
      transition: transform 0.2s;
    }
    #settings-fab:hover { transform: scale(1.1); }

    /* Settings sheet – tighter on small screens */
    #settings-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px 16px 32px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 1200;
      max-height: 85vh;
      overflow-y: auto;
    }
    #settings-sheet.open { transform: translateY(0); }

    .slider-container {
      margin: 16px 0;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: clamp(0.9rem, 3.5vw, 1rem);
    }

    /* Toggle switch – scaled down slightly */
    .switch { width: 50px; height: 28px; }
    .slider:before { height: 22px; width: 22px; left: 3px; bottom: 3px; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Media query for slightly larger screens (tablets/small landscape) */
    @media (min-width: 480px) {
      body { padding: 16px 16px 140px; }
      #ad-banner { height: 80px; }
      #settings-fab { top: 16px; right: 16px; width: 56px; height: 56px; font-size: 1.6rem; }
      #settings-sheet { padding: 24px 20px 40px; }
      button { min-width: 180px; }
    }

    /* Rest of your styles (chart-fullscreen, log-fullscreen, etc.) remain mostly unchanged */
    #chart-fullscreen, #log-fullscreen {
      padding: 12px 12px 80px;
    }
    .close-btn-bottom {
      padding: 10px 32px;
      font-size: clamp(1rem, 4vw, 1.1rem);
      min-width: 160px;
    }

    #video, #canvas, #chart-container { display: none; }
  </style>
  <!-- Your script tags and rest of <head> unchanged -->
</head>
<body>

</body>
</html>
